<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Access Denied — 403</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000; /* black background */
      font-family: Arial, sans-serif;
      color: #fff; /* white text */
    }
    .container {
      text-align: center;
      padding: 40px;
      background: #1a1a1a; /* dark gray card */
      border: 1px solid #333; /* gray border */
      border-radius: 10px;
      max-width: 480px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #fff;
    }
    p {
      color: #ccc; /* light gray */
      font-size: 16px;
      margin-top: 0;
    }
    .code {
      font-weight: bold;
      display: inline-block;
      padding: 4px 8px;
      background: #333;
      border-radius: 5px;
      color: #fff;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Access Denied <span class="code">403</span></h1>
    <p>You do not have permission to access this page.</p>
  </div>
</body>
</html>
